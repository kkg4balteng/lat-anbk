        let state = {
            screen: 'login', // login, dashboard, test, finish
            subject: null,
            currentIndex: 0,
            namaLengkap: '',
            satuanPendidikan: '',
            answers: { IPAS: {}, Matematika: {}, "Bahasa Indonesia": {} },
            doubtful: { IPAS: {}, Matematika: {}, "Bahasa Indonesia": {} },
            showNavList: false,
            timeLeft: 7200,
            timerInterval: null
        };

        // --- FUNGSI UTAMA RENDER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear current view

            if (state.screen === 'login') app.innerHTML = renderLogin();
            else if (state.screen === 'dashboard') app.innerHTML = renderDashboard();
            else if (state.screen === 'test') app.innerHTML = renderTest();
            else if (state.screen === 'finish') app.innerHTML = renderFinish();

            // Initialize Lucide Icons after DOM update
            lucide.createIcons();
        }

        // --- FUNGSI FORMAT WAKTU ---
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // --- FUNGSI LOGIKA APP ---
        function checkLoginInputs() {
            const nama = document.getElementById('inputNama').value;
            const sekolah = document.getElementById('inputSekolah').value;
            state.namaLengkap = nama;
            state.satuanPendidikan = sekolah;

            const btn = document.getElementById('btnLogin');
            if (nama.trim() !== '' && sekolah.trim() !== '') {
                btn.disabled = false;
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed', 'text-gray-200');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-400', 'cursor-not-allowed', 'text-gray-200');
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white');
            }
        }

        function doLogin() {
            if (state.namaLengkap.trim() && state.satuanPendidikan.trim()) {
                state.screen = 'dashboard';
                render();
            }
        }

        function doLogout() {
            state.screen = 'login';
            state.namaLengkap = '';
            state.satuanPendidikan = '';
            render();
        }

        function startTest(subject) {
            state.subject = subject;
            state.currentIndex = 0;
            state.screen = 'test';
            state.timeLeft = 7200;
            
            // Handle Timer
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    const timerEl = document.getElementById('timer-display');
                    if (timerEl) timerEl.innerText = formatTime(state.timeLeft);
                } else {
                    clearInterval(state.timerInterval);
                    finishTest(true);
                }
            }, 1000);

            render();
        }

        function handleAnswerChange(val) {
            state.answers[state.subject][state.currentIndex] = val;
            renderNavListItems(); // Hanya update daftar navigasi jika ada
        }

        function handleToggleDoubtful(isChecked) {
            state.doubtful[state.subject][state.currentIndex] = isChecked;
            renderNavListItems();
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                render();
            }
        }

        function nextQuestion() {
            const totalQ = soalData[state.subject].length;
            if (state.currentIndex < totalQ - 1) {
                state.currentIndex++;
                render();
            } else {
                if (confirm("Apakah Anda yakin ingin menyelesaikan tes ini?")) {
                    finishTest();
                }
            }
        }

        function jumpToQuestion(index) {
            state.currentIndex = index;
            if (window.innerWidth < 1024) toggleNavList(); // Auto close on mobile
            render();
        }

        function toggleNavList() {
            state.showNavList = !state.showNavList;
            render();
        }

        function finishTest(autoFinish = false) {
            if (state.timerInterval) clearInterval(state.timerInterval);
            if(autoFinish) alert("Waktu Habis! Ujian akan diselesaikan secara otomatis.");
            state.screen = 'finish';
            render();
        }

        function goDashboard() {
            state.screen = 'dashboard';
            render();
        }

        // --- RENDER LAYAR ---
        function renderLogin() {
            return `
            <div class="flex-1 flex items-center justify-center p-4">
                <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden border-t-4 border-blue-600">
                    <div class="bg-blue-600 p-6 text-center text-white">
                        <h1 class="text-2xl font-bold tracking-wider">CBT ANBK</h1>
                        <p class="text-blue-100 text-sm mt-1">Sistem Ujian Berbasis Komputer</p>
                    </div>
                    <div class="p-8">
                        <div class="mb-6">
                            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap</label>
                            <input type="text" id="inputNama" value="${state.namaLengkap}" placeholder="Masukkan Nama Lengkap" oninput="checkLoginInputs()" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" />
                        </div>
                        <div class="mb-8">
                            <label class="block text-gray-700 text-sm font-bold mb-2">Satuan Pendidikan</label>
                            <input type="text" id="inputSekolah" value="${state.satuanPendidikan}" placeholder="Masukkan Asal Sekolah" oninput="checkLoginInputs()" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" />
                        </div>
                        <button id="btnLogin" onclick="doLogin()" disabled class="w-full font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200 bg-gray-400 cursor-not-allowed text-gray-200">
                            LOGIN
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function renderDashboard() {
            let cardsHTML = '';
            for (const sub in soalData) {
                cardsHTML += `
                <div class="border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition bg-white">
                    <div class="bg-blue-50 p-4 border-b text-center">
                        <h3 class="font-bold text-lg text-blue-800">${sub}</h3>
                    </div>
                    <div class="p-4">
                        <p class="text-sm text-gray-600 mb-2"><strong>Status:</strong> Tersedia</p>
                        <p class="text-sm text-gray-600 mb-4"><strong>Jumlah Soal:</strong> ${soalData[sub].length} Butir</p>
                        <button onclick="startTest('${sub}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                            Mulai Tes
                        </button>
                    </div>
                </div>
                `;
            }

            return `
            <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
                <div class="font-bold text-xl hidden sm:block">DASHBOARD PESERTA</div>
                <div class="font-bold text-xl sm:hidden">DASHBOARD</div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span class="font-semibold text-sm sm:text-base">${state.namaLengkap}</span>
                    </div>
                    <button onclick="doLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold flex items-center gap-1 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i> <span class="hidden sm:inline">Keluar</span>
                    </button>
                </div>
            </header>
            
            <main class="container mx-auto p-4 sm:p-8 flex-1">
                <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-blue-500">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Daftar Tes Tersedia</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${cardsHTML}
                    </div>
                </div>
            </main>
            `;
        }

        function renderFinish() {
            return `
            <div class="flex-1 flex items-center justify-center p-4">
                <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full text-center border-t-4 border-green-500">
                    <div class="flex justify-center mb-4 text-green-500">
                        <i data-lucide="check-square" class="w-20 h-20"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">Tes Selesai!</h1>
                    <p class="text-gray-600 mb-6">Anda telah menyelesaikan tes ${state.subject}. Jawaban Anda telah tersimpan di sistem.</p>
                    <button onclick="goDashboard()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
                        Kembali ke Dashboard
                    </button>
                </div>
            </div>
            `;
        }

        function renderTest() {
            const currentQuestions = soalData[state.subject];
            const currentQ = currentQuestions[state.currentIndex];
            const answerValue = state.answers[state.subject][state.currentIndex] || "";
            const isDoubtful = state.doubtful[state.subject][state.currentIndex] || false;
            
            const isLast = state.currentIndex === currentQuestions.length - 1;
            const isFirst = state.currentIndex === 0;

            const nextBtnText = isLast ? 'SELESAI' : 'SOAL BERIKUTNYA';
            const nextBtnClass = isLast ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700';
            const nextBtnIcon = isLast ? '' : '<i data-lucide="chevron-right" class="w-5 h-5 ml-1"></i>';
            const prevBtnClass = isFirst ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-gray-600 hover:bg-gray-700 text-white shadow';

            // Sidebar (NavList)
            const navListHTML = state.showNavList ? `
            <div class="w-80 bg-white shadow-sm border-l border-gray-300 flex flex-col transition-all z-10 absolute right-0 top-0 bottom-0 lg:static lg:w-80">
                <div class="bg-[#1e3a8a] text-white p-3 font-bold flex justify-between items-center">
                    Daftar Soal
                    <button onclick="toggleNavList()" class="text-blue-200 hover:text-white lg:hidden"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto">
                    <div id="navListGrid" class="grid grid-cols-4 gap-2">
                        <!-- Items rendered by renderNavListItems() -->
                    </div>
                    <div class="mt-8 border-t pt-4">
                        <h4 class="font-bold text-sm text-gray-600 mb-3">Keterangan:</h4>
                        <div class="flex flex-col gap-2 text-sm">
                            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-white border border-gray-400"></div> Belum Dijawab</div>
                            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-blue-600 border border-blue-700"></div> Sudah Dijawab</div>
                            <div class="flex items-center gap-2"><div class="w-4 h-4 bg-yellow-400 border border-yellow-500"></div> Ragu-ragu</div>
                            <div class="flex items-center gap-2"><div class="w-4 h-4 border border-gray-400 ring-2 ring-blue-300"></div> Posisi Saat Ini</div>
                        </div>
                    </div>
                </div>
            </div>
            ` : '';

            // Overlay for mobile when sidebar is open
            const overlayHTML = state.showNavList ? `
                <div onclick="toggleNavList()" class="fixed inset-0 bg-black/50 z-0 lg:hidden"></div>
            ` : '';

            setTimeout(() => {
                if(state.showNavList) renderNavListItems();
            }, 0);

            return `
            <div class="flex-1 flex flex-col bg-[#e9ecef]">
                <!-- HEADER ANBK STYLE -->
                <header class="bg-[#1e3a8a] text-white shadow-md z-20 relative">
                    <div class="flex justify-between items-center px-4 py-2 border-b border-blue-800">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold text-xs">CBT</div>
                            <h1 class="text-lg font-bold tracking-wide hidden sm:block">CBT SIMULASI</h1>
                        </div>
                        <div class="flex items-center gap-6 text-sm">
                            <div class="bg-blue-900 px-3 py-1 rounded border border-blue-700 truncate max-w-[200px] sm:max-w-none">
                                <span class="text-blue-200 hidden sm:inline">Peserta:</span> <span class="font-bold">${state.namaLengkap} (${state.satuanPendidikan})</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center px-4 py-3 bg-[#2546a1]">
                        <div class="font-bold text-sm sm:text-lg">${state.subject} - KELAS 5</div>
                        <div class="flex items-center gap-2 sm:gap-4">
                            <div class="flex items-center gap-2 bg-black/20 px-2 sm:px-3 py-1 rounded text-yellow-300 font-mono text-base sm:text-lg font-bold border border-black/30">
                                <i data-lucide="clock" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                <span id="timer-display">${formatTime(state.timeLeft)}</span>
                            </div>
                            <button onclick="toggleNavList()" class="flex items-center gap-2 bg-white text-blue-900 px-2 sm:px-3 py-1 rounded font-bold hover:bg-gray-100 text-sm sm:text-base">
                                <i data-lucide="layout-grid" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                <span class="hidden sm:inline">Daftar Soal</span>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- MAIN CONTENT AREA -->
                <main class="flex-1 flex p-2 sm:p-4 gap-4 overflow-hidden relative">
                    
                    ${overlayHTML}

                    <!-- AREA SOAL KIRI -->
                    <div class="flex-1 bg-white rounded shadow-sm border border-gray-300 flex flex-col overflow-hidden relative z-0">
                        
                        <!-- Info Soal Top Bar -->
                        <div class="bg-[#f8f9fa] border-b border-gray-300 p-3 flex justify-between items-center">
                            <div class="font-bold text-base sm:text-lg text-gray-800 flex items-center gap-2">
                                <span class="bg-[#1e3a8a] text-white px-3 py-1 rounded">Soal No. ${state.currentIndex + 1}</span>
                                <span class="text-xs sm:text-sm font-normal text-gray-500 bg-gray-200 px-2 py-0.5 rounded">Tipe: ${currentQ.jenis}</span>
                            </div>
                            <div class="text-xs sm:text-sm text-gray-500 hidden sm:block">Ukuran Font: <span class="font-bold cursor-pointer">A</span> <span class="text-lg font-bold cursor-pointer">A</span></div>
                        </div>

                        <!-- Konten Soal -->
                        <div class="flex-1 p-4 sm:p-6 overflow-y-auto text-gray-800 text-base sm:text-lg leading-relaxed">
                            <div class="mb-6 text-justify">
                                ${currentQ.konteks}
                            </div>
                            <div class="font-bold mb-6 text-black">
                                ${currentQ.pertanyaan}
                            </div>
                            <!-- Area Jawaban -->
                            <div class="mt-8 border-t pt-6">
                                <label class="block font-bold text-gray-700 mb-2">Jawaban Anda:</label>
                                <textarea oninput="handleAnswerChange(this.value)" class="w-full h-40 p-4 border border-gray-400 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none text-base sm:text-lg shadow-inner bg-[#fdfdfd]" placeholder="Ketik jawaban Anda di sini...">${answerValue}</textarea>
                            </div>
                        </div>

                        <!-- Navigasi Bawah -->
                        <div class="bg-[#f8f9fa] border-t border-gray-300 p-3 sm:p-4 flex justify-between items-center flex-wrap gap-3">
                            <button onclick="prevQuestion()" ${isFirst ? 'disabled' : ''} class="flex items-center gap-1 sm:gap-2 px-3 sm:px-6 py-2 rounded font-bold transition text-xs sm:text-base ${prevBtnClass}">
                                <i data-lucide="chevron-left" class="w-4 h-4 sm:w-5 sm:h-5"></i> <span class="hidden sm:inline">SOAL SEBELUMNYA</span><span class="sm:hidden">SEBELUMNYA</span>
                            </button>

                            <label class="flex items-center gap-2 sm:gap-3 cursor-pointer bg-yellow-400 hover:bg-yellow-500 px-4 sm:px-6 py-2 rounded font-bold text-yellow-900 shadow transition text-xs sm:text-base">
                                <input type="checkbox" onchange="handleToggleDoubtful(this.checked)" ${isDoubtful ? 'checked' : ''} class="w-4 h-4 sm:w-5 sm:h-5 accent-yellow-600" />
                                RAGU-RAGU
                            </label>

                            <button onclick="nextQuestion()" class="flex items-center gap-1 sm:gap-2 px-3 sm:px-6 py-2 rounded font-bold shadow transition text-xs sm:text-base text-white ${nextBtnClass}">
                                <span>${nextBtnText}</span> ${nextBtnIcon}
                            </button>
                        </div>
                    </div>

                    ${navListHTML}
                </main>
            </div>
            `;
        }

        function renderNavListItems() {
            const grid = document.getElementById('navListGrid');
            if(!grid) return;

            const currentQuestions = soalData[state.subject];
            let html = '';

            currentQuestions.forEach((q, idx) => {
                const answerStr = state.answers[state.subject][idx];
                const isAnswered = answerStr && answerStr.trim() !== "";
                const isDoubtful = state.doubtful[state.subject][idx];
                const isActive = state.currentIndex === idx;
                
                let btnClass = "h-12 border rounded font-bold flex items-center justify-center transition-all relative ";
                
                if (isActive) btnClass += "ring-4 ring-blue-300 ";

                if (isDoubtful) {
                    btnClass += "bg-yellow-400 text-yellow-900 border-yellow-500";
                } else if (isAnswered) {
                    btnClass += "bg-blue-600 text-white border-blue-700";
                } else {
                    btnClass += "bg-white text-gray-700 border-gray-400 hover:bg-gray-100";
                }

                const checkIcon = (isAnswered && !isDoubtful) ? `<i data-lucide="check-square" class="w-3 h-3 absolute bottom-1 right-1 opacity-70"></i>` : '';

                html += `
                <button onclick="jumpToQuestion(${idx})" class="${btnClass}">
                    ${idx + 1}
                    ${checkIcon}
                </button>
                `;
            });

            grid.innerHTML = html;
            lucide.createIcons(); // Update icons dynamically inserted
        }

        // --- INIT APLIKASI ---
        document.addEventListener("DOMContentLoaded", () => {
            render();
            // Inisialisasi pengecekan button login saat pertama dimuat
            if (state.screen === 'login') checkLoginInputs();
        });

    </script>
</body>
</html>
